<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Informações, builds, counters e estatísticas do campeão no Wild Rift Guide." />
  <meta name="theme-color" content="#050b14" />

  <!-- O title é atualizado dinamicamente pelo champion.js -->
  <title>Carregando... — Wild Rift Guide</title>

  <!-- Favicon placeholder -->
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/champion.css" />
</head>
<body>

  <!-- ─── Navbar ──────────────────────────────────────────────── -->
  <header class="navbar" role="banner">
    <div class="navbar__inner">

      <!-- Logo -->
      <a href="/" class="navbar__logo" aria-label="Wild Rift Guide — Página inicial">
        <div class="navbar__logo-icon" aria-hidden="true">WR</div>
        <span>Wild Rift Guide</span>
      </a>

      <!-- Navegação desktop -->
      <nav id="nav-menu" class="navbar__nav" aria-label="Navegação principal">
        <a href="/" class="navbar__link">Início</a>
        <a href="/#champions" class="navbar__link active" aria-current="page">Campeões</a>
        <a href="#" class="navbar__link" aria-disabled="true" title="Em breve">Tier List</a>
        <a href="#" class="navbar__link" aria-disabled="true" title="Em breve">Builds</a>
        <a href="#" class="navbar__link" aria-disabled="true" title="Em breve">Counters</a>
      </nav>

      <!-- Botão hamburguer (mobile) -->
      <button
        id="nav-toggle"
        class="navbar__toggle"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>

  <!-- ─── Conteúdo principal ──────────────────────────────────── -->
  <!--
    Todo o conteúdo da página do campeão é injetado dinamicamente
    pelo champion.js dentro deste elemento.
  -->
  <main
    id="champion-container"
    class="page-content"
    aria-live="polite"
    aria-label="Informações do campeão"
  >
    <!-- Estado inicial de carregamento — substituído pelo JS -->
    <div class="loading-state" role="status" style="padding: 6rem 1rem;">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Carregando dados do campeão...</p>
    </div>
  </main>

  <!-- ─── Rodapé ───────────────────────────────────────────────── -->
  <footer style="border-top: 1px solid var(--border); padding: var(--space-xl) 0; margin-top: var(--space-2xl);">
    <div class="container" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-md);">
      <p style="font-size: 0.8rem; color: var(--text-muted);">
        Wild Rift Guide &mdash; Projeto em desenvolvimento
      </p>
      <p style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">
        Dados demonstrativos. Não afiliado à Riot Games.
      </p>
    </div>
  </footer>

  <!-- ─── Scripts ──────────────────────────────────────────────── -->
  <!--
    api.js deve ser carregado antes de champion.js.
  -->
  <script src="/js/api.js"></script>
  <script src="/js/champion.js"></script>

  <!-- Estilo utilitário para acessibilidade -->
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

</body>
</html>
